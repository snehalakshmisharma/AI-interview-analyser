version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      JWT_SECRET: dev-secret-key-change-in-prod-32chars-long
      AI_MODE: ${AI_MODE:-demo}
      WHISPER_API_URL: http://whisper:8000/transcribe
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_AI_MODE: ${NEXT_PUBLIC_AI_MODE:-demo}
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

  whisper:
    build: ./whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_DOWNLOAD_ROOT: /models
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - whisper_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  whisper_models:
